[tool.poetry]
name = "emotion-recognition"
version = "0.1.0"
description = "Audio-based emotion recognition system using deep learning"
authors = ["Andrej Ilin <your.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "emotion_recognition"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
tensorflow = "2.19.0"
librosa = "0.11.0"
scikit-learn = "1.6.1"
numpy = "2.1.3"
streamlit = ">=1.15.0"
audio-recorder-streamlit = ">=0.0.8"
matplotlib = ">=3.5.0"
pydantic = "^2.0.0"
hydra-core = "^1.3.0"
mlflow = "^2.0.0"
onnx = "^1.15.0"
onnxruntime = "^1.16.0"
pre-commit = "^3.0.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
dvc = "^3.0.0"
pyyaml = "^6.0.0"
opencv-python = "4.11.0.86"
pyaudio = "0.2.14"
tf2onnx = "^1.16.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "build",
    "dist"
]
